name: Brand check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  brand-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brand check
        env:
          BASE: ${{ github.base_ref || 'main' }}
          LAYER: gong-brand
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          if git diff --quiet "origin/${BASE}" -- "${LAYER}/VENDOR.json"; then
            python3 -I .github/gong-brand/brand-check.py --root . --config .github/brand-check.json --baseline-ref "git:origin/${BASE}"
          else
            python3 -I .github/gong-brand/brand-check.py --root . --config .github/brand-check.json
          fi
      - name: Page test
        run: python3 -I .github/check-page.py
